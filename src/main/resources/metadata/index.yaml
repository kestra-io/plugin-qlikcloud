group: io.kestra.plugin.qlikcloud
name: "qlikcloud"
title: "Qlik Cloud"
description: "Tasks that trigger and monitor Qlik Cloud app reloads and Qlik Automate automation runs"
body: "Use this plugin to trigger a Qlik Cloud app reload or run a Qlik Automate automation from a Kestra flow, and optionally wait for it to finish. Target the app or automation by id, or by its space and resource name. Authenticate with a Qlik Cloud API key or a pre-obtained OAuth access token."
